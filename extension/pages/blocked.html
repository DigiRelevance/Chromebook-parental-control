<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site not allowed</title>
<style>
  :root {
    --paper: #f7f4ee;
    --paper-2: #efeadd;
    --ink: #22201c;
    --ink-soft: #5c574d;
    --brass: #8a6d2f;
    --line: #d9d2c2;
    --card: #fffdf9;
    --corner: 3px;
  }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 460px; width: 100%; }
  .illustration { display: block; width: 100%; max-width: 300px; height: auto; margin: 0 0 14px -8px; }
  .kicker {
    font-family: "Newsreader", Georgia, serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }
  h1 { font-family: "Newsreader", Georgia, serif; font-size: 26px; font-weight: 500; margin: 6px 0 10px; }
  p { color: var(--ink-soft); margin: 0 0 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--corner);
    padding: 14px 16px;
    font-size: 13px;
  }
  .card .row { display: flex; justify-content: space-between; padding: 4px 0; }
  .card .k { color: var(--ink-soft); }
  .card .v { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
  footer { margin-top: 22px; font-size: 11px; color: var(--ink-soft); }
  .actions { margin-top: 16px; }
  button {
    font: inherit; font-size: 13px; padding: 8px 14px; cursor: pointer;
    background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: var(--corner);
  }
</style>
</head>
<body>
  <main>
    <svg class="illustration" viewBox="0 0 460 320" role="img" aria-label="The clock mark at night under a crescent moon">
  <path d="M372 58a34 34 0 1 0 22 50a27 27 0 0 1-22-50z" fill="#b79a55"/>
  <circle cx="96" cy="84" r="4" fill="#b79a55"/>
  <circle cx="150" cy="44" r="3" fill="#b79a55"/>
  <circle cx="312" cy="40" r="3" fill="#b79a55"/>
  <circle cx="64" cy="150" r="3" fill="#b79a55"/>
  <g transform="translate(143.6 83.4) scale(1.8)">
    <path fill-rule="evenodd" d="M48 4a44 44 0 1 0 0 88a44 44 0 1 0 0-88zM55 41V11.67A37 37 0 0 1 84.33 41z" fill="#8a6d2f"/>
    <path d="M45 14h6v34h-6zM48 45h26v6H48z" fill="#f7f4ee"/>
    <circle cx="48" cy="48" r="7" fill="#f7f4ee"/>
    <circle cx="48" cy="48" r="2.5" fill="#8a6d2f"/>
  </g>
  <path d="M36 249.5h388" stroke="#d9d2c2" stroke-width="3" fill="none"/>
  <path d="M60 266h120M210 266h60M300 266h100" stroke="#d9d2c2" stroke-width="3" fill="none"/>
</svg>
    <div class="kicker">SCOUT</div>
    <h1 id="title">This site&#8217;s not allowed right now</h1>
    <p id="lede">The family rules block this destination. If you&#8217;re a parent, check
       the console for the current rules.</p>
    <div class="card">
      <div class="row"><span class="k">Site</span>    <span class="v" id="url">&#8212;</span></div>
      <div class="row"><span class="k">Reason</span>  <span class="v" id="reason">blocked by policy</span></div>
      <div class="row"><span class="k">Time</span>    <span class="v" id="when">&#8212;</span></div>
    </div>
    <div class="actions"><button id="back">Go back</button></div>
    <footer>SCOUT &middot; your family's rules, kept at home</footer>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
