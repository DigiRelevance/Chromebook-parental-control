name: Security tests
# Adversarial test suite: authentication bypass attempts, injection and
# prototype pollution, information leaks, cross-child isolation, DoS limits,
# path traversal, rule-engine fail-closed and regex-safety invariants, and
# repository hygiene tripwires (manifest permissions, no phone-home, pinned
# actions, hardened container, dependency surface).
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
concurrency:
  group: security-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security-tests:
    name: security-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:security
