name: Publish
# Builds the Docker image and pushes it to GitHub Container Registry so that
# `docker compose up -d` works with no local build. On a version tag it also
# attaches a ready-to-load extension zip to the GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Release from the Actions tab: "Run workflow" with the version from
  # extension/manifest.json. Tags v<version> at the chosen commit, publishes the
  # image with that version and attaches the extension zip to a GitHub Release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (must equal extension/manifest.json)"
        required: true
        type: string
permissions:
  contents: write
  packages: write
env:
  # The release tag: from the pushed tag, or built from the dispatch input.
  REL_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
jobs:
  check:
    # Dispatch only: the requested version must be the one in the manifest and must not already be tagged.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version input matches extension/manifest.json and is new
        run: |
          set -e
          m=$(node -p "require('./extension/manifest.json').version")
          [ "$m" = "${{ inputs.version }}" ] || { echo "::error::manifest version is $m, input is ${{ inputs.version }}"; exit 1; }
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must be MAJOR.MINOR.PATCH"; exit 1; }
          git fetch --tags --quiet
          ! git rev-parse -q --verify "refs/tags/v${{ inputs.version }}" >/dev/null || { echo "::error::tag v${{ inputs.version }} already exists"; exit 1; }
  image:
    needs: [check]
    if: always() && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  extension:
    needs: [check]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.check.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:ext
      - run: cd extension && zip -r ../chpc-extension-${REL_TAG}.zip . -x '*.map'
      - name: Zip sanity (manifest at the root, version matches the tag)
        run: |
          set -e
          unzip -l chpc-extension-${REL_TAG}.zip | grep -q ' manifest.json$'
          unzip -p chpc-extension-${REL_TAG}.zip manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s).version; if('v'+v!==process.env.REL_TAG){console.error('manifest '+v+' != '+process.env.REL_TAG);process.exit(1)}})"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          # On dispatch this creates the tag at the current commit; on a tag push it reuses it.
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ github.sha }}
          name: SCOUT ${{ env.REL_TAG }}
          files: chpc-extension-*.zip
          generate_release_notes: true
