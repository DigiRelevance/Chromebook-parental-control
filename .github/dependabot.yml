version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # react and react-dom must move together: a mismatched pair fails at runtime.
      react:
        patterns: ["react", "react-dom"]
      dev-toolchain:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # eslint-plugin-react does not yet declare support for ESLint 10; a major
      # bump makes `npm ci` fail with a peer conflict. Lift when the plugin does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # scorecard-action 2.6.0 was released without its Docker image
      # (ghcr.io/ossf/scorecard-action:v2.6.0 is missing), so the job cannot
      # start. Stay on 2.5.0; lift when 2.6.1 or later is out.
      - dependency-name: "ossf/scorecard-action"
        versions: ["2.6.0"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Stay on even-numbered (LTS) Node images; odd releases are short-lived.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
